services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_os
    ports:
      - "5432:5432"
    volumes:
      - restaurant_os_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_os"]
      interval: 2s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: restaurant-os-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db

  db_test:
    image: postgres:16-alpine
    container_name: restaurant-os-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_os_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_os_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  restaurant_os_pg:
