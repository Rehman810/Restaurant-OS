name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/deploy-backend.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/deploy-backend.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_os_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_os_ci?schema=public
      JWT_SECRET: ci-test-jwt-secret-with-at-least-32-characters
      SEED_ADMIN_PASSWORD: admin
      PORT: 4000
      CLIENT_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data for integration tests
        run: npx tsx prisma/seed.ts
        env:
          NODE_ENV: development

      - name: Tenancy guard
        run: npm run tenancy:check

      - name: Typecheck and build
        run: npm run build

      - name: Unit and integration tests
        run: npm run test

      - name: Smoke test /health
        run: |
          npx tsx src/index.ts &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:4000/health | grep -q '"ok":true'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed — server did not respond in time"
          exit 1

  deploy:
    name: Deploy to Oracle server
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST || vars.ORACLE_SSH_HOST }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || vars.ORACLE_SSH_USER }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY || vars.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_B64 || vars.ORACLE_SSH_PRIVATE_KEY_B64 }}
      ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR || vars.ORACLE_APP_DIR }}
      API_SERVICE_NAME: ${{ secrets.API_SERVICE_NAME || vars.API_SERVICE_NAME }}

    steps:
      - name: Verify deploy configuration
        run: |
          missing=0
          if [ -z "$ORACLE_SSH_HOST" ]; then
            echo "::error::Missing ORACLE_SSH_HOST — set to 80.225.219.189"
            missing=1
          fi
          if [ -z "$ORACLE_SSH_USER" ]; then
            echo "::error::Missing ORACLE_SSH_USER — set to ubuntu"
            missing=1
          fi
          if [ -z "$ORACLE_SSH_PRIVATE_KEY_B64" ]; then
            echo "::error::Missing ORACLE_SSH_PRIVATE_KEY_B64 in Secrets (required)"
            echo "Run locally: bash scripts/print-github-ssh-b64.sh \"/path/to/ssh-key.key\""
            missing=1
          fi
          if [ -z "$ORACLE_APP_DIR" ]; then
            echo "::error::Missing ORACLE_APP_DIR — set it to the app directory on the server"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Prepare SSH key file
        run: |
          KEY_FILE="$RUNNER_TEMP/oracle_deploy_key"
          B64="$(echo -n "$ORACLE_SSH_PRIVATE_KEY_B64" | tr -d '\n\r ')"
          B64_LEN=${#B64}
          echo "Base64 secret length: $B64_LEN chars (deploy key ~560, oracle .key ~2240)"
          if [ "$B64_LEN" -lt 400 ]; then
            echo "::error::Secret too short ($B64_LEN chars) — you pasted an incomplete key."
            echo "On your PC run: cat ~/gha-oracle-deploy-b64.txt"
            echo "Copy the ENTIRE line into GitHub Secrets → ORACLE_SSH_PRIVATE_KEY_B64"
            exit 1
          fi
          if ! echo "$B64" | base64 -d > "$KEY_FILE" 2>/dev/null; then
            echo "::error::ORACLE_SSH_PRIVATE_KEY_B64 is not valid base64."
            exit 1
          fi
          chmod 600 "$KEY_FILE"
          KEY_BYTES=$(wc -c < "$KEY_FILE")
          echo "Decoded key size: $KEY_BYTES bytes"
          if ! grep -q 'BEGIN.*PRIVATE KEY' "$KEY_FILE"; then
            echo "::error::Decoded file is not a private key. Wrong base64 pasted."
            echo "Use: cat ~/gha-oracle-deploy-b64.txt  (new deploy-only key, already on server)"
            exit 1
          fi
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::Key file corrupt. Re-copy the full line from ~/gha-oracle-deploy-b64.txt"
            exit 1
          fi
          echo "SSH key OK"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.ORACLE_SSH_HOST }}
          username: ${{ env.ORACLE_SSH_USER }}
          key_path: ${{ runner.temp }}/oracle_deploy_key
          port: 22
          envs: APP_DIR,API_SERVICE_NAME
          script: |
            set -e
            SERVICE_NAME="${API_SERVICE_NAME:-backend}"
            echo "==> Deploying from $APP_DIR"
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            npm install
            cd backend
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart "$SERVICE_NAME"
            pm2 save
            echo "==> Deploy complete"
        env:
          APP_DIR: ${{ env.ORACLE_APP_DIR }}
          API_SERVICE_NAME: ${{ env.API_SERVICE_NAME }}
